# .github/workflows/sync.yml
# Pulls the latest snapshot from Consurf, writes one JSON file per convention,
# validates everything against the published schemas and, when anything
# changed, commits, tags (YYYY.MM.DD) and publishes a release whose
# `changes.json` asset lists the convention files that were added, modified or
# removed since the previous release.
#
# Repository secrets:
#   OPEN_DATA_URL      full URL of the Consurf snapshot endpoint
#   OPEN_DATA_API_KEY  key sent as the x-api-key header

name: Sync open data

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: sync-open-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    # Releases only ever come from the default branch
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed to find the previous release

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download snapshot
        env:
          URL: ${{ secrets.OPEN_DATA_URL }}
          KEY: ${{ secrets.OPEN_DATA_API_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::OPEN_DATA_URL and OPEN_DATA_API_KEY secrets must be set"
            exit 1
          fi
          curl --fail --silent --show-error --compressed \
            --retry 3 --retry-all-errors --max-time 120 \
            -H "x-api-key: ${KEY}" \
            -o "$RUNNER_TEMP/snapshot.json" "$URL"

      - name: Write and validate convention files
        run: node scripts/sync.mjs write "$RUNNER_TEMP/snapshot.json"

      - name: Detect changes
        id: changes
        run: |
          git add -A data schema
          # data/index.json always carries a fresh timestamp, so only content counts
          if git diff --cached --quiet -- data/conventions schema; then
            echo "No convention or schema changes; nothing to release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and tag
        id: release
        if: steps.changes.outputs.changed == 'true'
        run: |
          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          base="$(date -u +%Y.%m.%d)"
          tag="$base"
          n=2
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            tag="$base.$n"
            n=$((n + 1))
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "data: $tag"
          git tag -a "$tag" -m "Open data $tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        if: steps.changes.outputs.changed == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
        run: |
          node scripts/sync.mjs manifest \
            --release "$TAG" --previous "$PREVIOUS" --commit "$(git rev-parse HEAD)" \
            --out "$RUNNER_TEMP/changes.json" --notes "$RUNNER_TEMP/release-notes.md"
          zip -q -r "$RUNNER_TEMP/consurf-open-data-$TAG.zip" data schema README.md LICENSE.md

      # Push only after every asset was built, so a tag never exists without its release
      - name: Push and publish release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/$TAG"
          gh release create "$TAG" \
            --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP/changes.json" \
            "$RUNNER_TEMP/consurf-open-data-$TAG.zip"
